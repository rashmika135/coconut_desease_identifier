<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>

    <title>Coconut Disease Detector</title>

</head>

<body>

    <div class='container'>

        <h1>Coconut Disease Detector</h1>

        <p class='description'>
            Upload a coconut leaf image to identify its condition.
        </p>

        <div class='upload-box'>

            <input
                type='file'
                id='imageInput'
                accept='image/*'
            >

            <img
                id='preview'
                class='preview'
                alt='Image preview'
            >

            <button
                id='predictButton'
                disabled
            >
                Predict
            </button>

        </div>

        <div
            id='result'
            class='result'
        ></div>

    </div>

</body>

</html>
